<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calco de carátulas en mm</title>
<style>
:root{--bg:#f4f4f2;--fg:#1c1c1c;--card:#fff;--bd:#d6d6d0;--ac:#0a7d70;--sh:#e8452c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#ececec;--card:#1f2226;--bd:#3a3f45;--ac:#3cc7b4;--sh:#ff7a62}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0 10px 0 0}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=number]{width:70px}
main{display:flex;gap:12px;padding:12px;flex-wrap:wrap}
#stage{flex:1 1 560px;min-width:0;overflow:auto;border:1px solid var(--bd);background:var(--card);max-height:calc(100vh - 120px)}
svg{display:block;touch-action:none;cursor:crosshair;background:#fff}
aside{flex:0 0 280px;max-width:100%}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--bd);font-size:12px}
#pos{font-variant-numeric:tabular-nums;color:var(--ac)}
small{opacity:.7}
</style>
</head>
<body>
<header>
  <h1>Calco en mm</h1>
  <input type="file" id="file" accept="image/*,application/pdf">
  <button data-t="rect" class="on">Rectángulo</button>
  <button data-t="line">Línea</button>
  <button data-t="circle">Círculo</button>
  <button data-t="poly">Polígono</button>
  <button id="undo">Deshacer</button>
  <label>Zoom <input type="range" id="zoom" min="50" max="400" value="100"></label>
</header>
<main>
  <div id="stage"><svg id="svg" viewBox="0 0 210 297" width="800"></svg></div>
  <aside>
    <div class="box">
      <b>Escala</b><br>
      <small>Por defecto la imagen ocupa toda la hoja. Si escaneaste a otro DPI y con márgenes, indícalo.</small><br><br>
      Hoja:
      <select id="paper"><option value="210x297">A4 completo</option><option value="297x420">A3 completo</option><option value="pdf">Tamaño del PDF</option><option value="dpi">Por DPI</option></select>
      <input type="number" id="dpi" value="300" min="50" max="1200" style="display:none"><br><br>
      Ajuste: <input type="number" id="snap" value="0.5" step="0.1" min="0"> mm<br>
      Cursor: <span id="pos">–</span>
    </div>
    <div class="box">
      <b>Formas</b> <small>(doble clic cierra polígono)</small>
      <div id="list"></div>
    </div>
    <div class="box">
      <b>Exportar</b><br><br>
      <button id="xml">XML</button> <button id="json">JSON</button> <button id="svgx">SVG</button>
    </div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const svg=document.getElementById('svg'),NS='http://www.w3.org/2000/svg';
let pdfMM=null,W=210,H=297,img=null,imgPx=[0,0],tool='rect',shapes=[],draft=null,hover=null;
const $=id=>document.getElementById(id);
const snapV=v=>{const s=+$('snap').value;return s>0?Math.round(v/s)*s:v};
const r2=v=>Math.round(v*100)/100;

function setSize(){
  const m=$('paper').value;
  $('dpi').style.display=m==='dpi'?'':'none';
  if(m==='pdf'&&pdfMM){W=pdfMM[0];H=pdfMM[1]}
  else if(m==='dpi'&&img){W=imgPx[0]/$('dpi').value*25.4;H=imgPx[1]/$('dpi').value*25.4}
  else if(img){const [a,b]=m.split('x').map(Number);const land=imgPx[0]>imgPx[1];W=land?b:a;H=land?a:b}
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);zoom();draw();
}
function zoom(){svg.setAttribute('width',800*$('zoom').value/100);svg.setAttribute('height',800*$('zoom').value/100*H/W)}
$('zoom').oninput=zoom;$('paper').onchange=setSize;$('dpi').oninput=setSize;
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      const pg=await doc.getPage(1),v1=pg.getViewport({scale:1}),vp=pg.getViewport({scale:3});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      pdfMM=[v1.width/72*25.4,v1.height/72*25.4];img=c.toDataURL('image/png');imgPx=[c.width,c.height];
      $('paper').value='pdf';setSize();
    }catch(err){alert('No pude leer el PDF: '+err.message)}
    return;
  }
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{img=u;imgPx=[i.naturalWidth,i.naturalHeight];setSize()};i.src=u;
};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.t;draft=null;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));draw()});
$('undo').onclick=()=>{if(draft){draft=null}else shapes.pop();draw()};

function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:r2(snapV(q.x)),y:r2(snapV(q.y))}}
svg.onpointerdown=e=>{
  const p=pt(e);
  if(tool==='poly'){if(!draft)draft={type:'poly',pts:[]};draft.pts.push(p);hover=p;draw();return}
  svg.setPointerCapture(e.pointerId);draft={type:tool,a:p,b:p};draw();
};
svg.onpointermove=e=>{
  const p=pt(e);$('pos').textContent=`${p.x} , ${p.y} mm`;
  if(draft){if(draft.type==='poly')hover=p;else draft.b=p;draw()}
};
svg.onpointerup=()=>{
  if(!draft||draft.type==='poly')return;
  const d=draft;draft=null;
  if(Math.hypot(d.b.x-d.a.x,d.b.y-d.a.y)>0.2)shapes.push(norm(d));
  draw();
};
svg.ondblclick=()=>{
  if(draft&&draft.type==='poly'){
    if(draft.pts.length>2)draft.pts.pop(); // quita el punto duplicado del segundo clic
    if(draft.pts.length>=3)shapes.push(draft);
    draft=null;draw();
  }
};
function norm(d){
  const {a,b}=d;
  if(d.type==='rect')return {type:'rect',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:r2(Math.abs(b.x-a.x)),h:r2(Math.abs(b.y-a.y))};
  if(d.type==='line')return {type:'line',x1:a.x,y1:a.y,x2:b.x,y2:b.y};
  return {type:'circle',cx:a.x,cy:a.y,r:r2(Math.hypot(b.x-a.x,b.y-a.y))};
}
function el(s,col){
  const st=`fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"`;
  if(s.type==='rect')return `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" ${st}/>`;
  if(s.type==='line')return `<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" ${st}/>`;
  if(s.type==='circle')return `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" ${st}/>`;
  return `<polygon points="${s.pts.map(p=>p.x+','+p.y).join(' ')}" ${st}/>`;
}
function desc(s,i){
  const n=`${s.type}${i+1}`;
  if(s.type==='rect')return `${n}: ${s.x},${s.y} · ${s.w}×${s.h}`;
  if(s.type==='line')return `${n}: (${s.x1},${s.y1})→(${s.x2},${s.y2})`;
  if(s.type==='circle')return `${n}: c(${s.cx},${s.cy}) r${s.r}`;
  return `${n}: ${s.pts.length} puntos`;
}
function draw(){
  let h=img?`<image href="${img}" x="0" y="0" width="${W}" height="${H}"/>`:`<rect width="${W}" height="${H}" fill="#fff" stroke="#bbb" stroke-width="0.3"/>`;
  shapes.forEach(s=>h+=el(s,'#e8452c'));
  if(draft){
    if(draft.type==='poly'){
      const pts=[...draft.pts];if(hover)pts.push(hover);
      h+=`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#0a7d70" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    }else h+=el(norm(draft),'#0a7d70');
  }
  svg.innerHTML=h;
  $('list').innerHTML=shapes.map((s,i)=>`<div class="row"><span>${desc(s,i)}</span><button data-d="${i}">✕</button></div>`).join('')||'<small>Sin formas todavía</small>';
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{shapes.splice(+b.dataset.d,1);draw()});
}
function dl(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click()}
$('json').onclick=()=>dl('plantilla.json',JSON.stringify({unit:'mm',width:r2(W),height:r2(H),shapes},null,2),'application/json');
$('svgx').onclick=()=>{
  const body=shapes.map(s=>el(s,'#000').replace(/ vector-effect="[^"]*"/,'').replace('stroke-width="2"','stroke-width="0.2"')).join('\n');
  dl('plantilla.svg',`<svg xmlns="${NS}" width="${r2(W)}mm" height="${r2(H)}mm" viewBox="0 0 ${r2(W)} ${r2(H)}">\n${body}\n</svg>`,'image/svg+xml');
};
$('xml').onclick=()=>{
  const l=shapes.map((s,i)=>{
    const id=`${s.type}${i+1}`;
    if(s.type==='rect')return `  <rect id="${id}" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}"/>`;
    if(s.type==='line')return `  <line id="${id}" x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}"/>`;
    if(s.type==='circle')return `  <circle id="${id}" cx="${s.cx}" cy="${s.cy}" r="${s.r}"/>`;
    return `  <polygon id="${id}" points="${s.pts.map(p=>p.x+','+p.y).join(' ')}"/>`;
  }).join('\n');
  dl('plantilla.xml',`<?xml version="1.0" encoding="UTF-8"?>\n<plantilla unidad="mm" ancho="${r2(W)}" alto="${r2(H)}">\n${l}\n</plantilla>`,'application/xml');
};
draw();
</script>
</body>
</html>
